<!-- templates/detail.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Detail Mahasiswa</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        td { padding: 4px 12px 4px 0; }
    </style>
</head>
<body>
    <h2>Detail Mahasiswa</h2>
    <table>
        <tr><td>NIM</td><td>: {{ m.nim }}</td></tr>
        <tr><td>Nama</td><td>: {{ m.nama }}</td></tr>
        <tr><td>Program Studi</td><td>: {{ m.program_studi }}</td></tr>
        <tr><td>Angkatan</td><td>: {{ m.angkatan }}</td></tr>
        <tr><td>IPK</td><td>: {{ "%.2f"|format(m.ipk) }}</td></tr>
        <tr><td>Lama Studi</td><td>: {{ m.lama_studi }} tahun</td></tr>
    </table>
    <br>
    <a href="/mahasiswa/{{ m.nim }}/edit"><button type="button">Update</button></a>
    <a href="/mahasiswa"><button type="button">Kembali</button></a>
</body>
</html>
